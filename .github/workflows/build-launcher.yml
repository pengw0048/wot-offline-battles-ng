name: Build Windows launcher

on:
  workflow_dispatch:
    inputs:
      client_build_run:
        description: 'Run of "Build standalone BigWorld client" whose bigworld-client-win32 artifact to package'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          architecture: "x64"
      - name: Install pinned Windows packager
        run: >-
          python -m pip install
          -r server/requirements-windows-build.txt Pillow==12.3.0
      - name: Take the selected NG client package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_BUILD_RUN: ${{ inputs.client_build_run }}
        run: |
          $client = Join-Path $env:RUNNER_TEMP "ng-client"
          gh run download $env:CLIENT_BUILD_RUN --repo $env:GITHUB_REPOSITORY `
            -n bigworld-client-win32 -D $client
          if ($LASTEXITCODE -ne 0) { throw "Unable to retrieve the selected NG client build" }
      - name: Compose the NG launcher source tree
        run: >-
          python tools/stage_ng_launcher_source.py
          --output "${{ runner.temp }}\ng-launcher-source"
      - name: Test launcher on Windows
        working-directory: ${{ runner.temp }}\ng-launcher-source\launcher
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build launcher distribution
        shell: pwsh
        env:
          WOT_OFFLINE_BUILD_IDENTITY: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          pwsh -NoProfile -File
          "$env:RUNNER_TEMP\ng-launcher-source\launcher\build_launcher.ps1"
          -NgClient "$env:RUNNER_TEMP\ng-client"
      - name: Verify the NG payload and the bundled server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tree = Join-Path $env:RUNNER_TEMP "ng-launcher-source"
          $appName = "wot-0.9.22-offline-battles-ng"
          $appRoot = Join-Path $tree "launcher\dist\$appName"
          $launcher = Join-Path $appRoot "$appName.exe"
          $payload = Join-Path $appRoot "_internal"

          @'
          import os
          import struct
          import sys
          import zipfile

          sys.path.insert(0, os.path.join(sys.argv[1], 'launcher'))
          import core
          import ng_client
          import stage_payload

          launcher, payload, expected = sys.argv[2:5]
          with open(launcher, 'rb') as stream:
              stream.seek(0x3c)
              pe_offset = struct.unpack('<I', stream.read(4))[0]
              stream.seek(pe_offset + 4)
              machine = struct.unpack('<H', stream.read(2))[0]
          assert machine == 0x8664, 'expected an x64 launcher, got 0x%04x' % machine
          package = ng_client.package_root(payload)
          assert package is not None, payload
          identity = core.bundled_payload_identity(core.PORT_0_9_22, payload)
          assert identity['buildIdentity'] == expected, identity
          assert not os.path.exists(os.path.join(payload, 'client'))
          assert os.path.isfile(ng_client.executable(package))
          symbols = [os.path.join(root, name) for root, _, names in os.walk(payload)
                     for name in names if name.lower().endswith('.pdb')]
          assert not symbols, symbols

          retired_paths = stage_payload.NG_CLIENT_EXCLUDED_RELATIVE_PATHS
          retired_sidecars = frozenset((
              'org.colorfulmeans.offline_lan_0922_0.10.1.wotmod',
              'recorder-runtime.zip',
          ))

          def verify_retired_entries(names, label):
              forbidden = [name for name in names
                           if name.rsplit('/', 1)[-1] in retired_sidecars or any(
                               name == path or name.startswith(path + '/')
                               for path in retired_paths)]
              assert not forbidden, (label, forbidden)

          package_names = [os.path.relpath(os.path.join(root, name), package).replace('\\', '/')
                           for root, directories, files in os.walk(package)
                           for name in directories + files]
          verify_retired_entries(package_names, 'NG payload')
          app_root = os.path.dirname(launcher)
          archive = os.path.join(os.path.dirname(app_root),
                                 os.path.basename(app_root) + '-Windows.zip')
          package_prefix = os.path.relpath(package, os.path.dirname(app_root)).replace('\\', '/') + '/'
          with zipfile.ZipFile(archive) as final_zip:
              names = [name.replace('\\', '/') for name in final_zip.namelist()]
              assert package_prefix + 'bwclient_h.exe' in names, 'final ZIP is missing the NG executable'
              verify_retired_entries([name[len(package_prefix):].rstrip('/')
                                      for name in names if name.startswith(package_prefix)],
                                     'final launcher ZIP')
          '@ | python - $tree $launcher $payload "github-${{ github.run_id }}-${{ github.run_attempt }}"
          if ($LASTEXITCODE -ne 0) {
              throw "NG payload verification failed"
          }

          $ProtocolProbe = @'
          import os
          import sys
          sys.path.insert(0, os.path.join(sys.argv[1], 'launcher'))
          import core
          raise SystemExit(0 if core.probe_server_protocol(
              core.PORT_0_9_22, '127.0.0.1', core.DEFAULT_SERVER_PORT,
              timeout=1.0) else 1)
          '@
          $process = Start-Process -FilePath $launcher `
              -ArgumentList "--serve", "0.9.22" -PassThru
          try {
              $deadline = (Get-Date).AddSeconds(60)
              $compatible = $false
              while ((Get-Date) -lt $deadline) {
                  if ($process.HasExited) {
                      throw "The bundled server exited before its protocol answered"
                  }
                  $ProtocolProbe | python - $tree
                  if ($LASTEXITCODE -eq 0) {
                      $compatible = $true
                      break
                  }
                  Start-Sleep -Milliseconds 250
              }
              if (-not $compatible) {
                  throw "The bundled server did not answer the battle wire protocol"
              }
          }
          finally {
              if (-not $process.HasExited) {
                  & taskkill.exe /PID $process.Id /T /F | Out-Null
                  $global:LASTEXITCODE = 0
              }
              $log = Join-Path $appRoot "server.log"
              if (Test-Path $log) {
                  Write-Host "--- launcher server log ---"
                  Get-Content $log -Tail 60
              }
              Start-Sleep -Seconds 2
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wot-offline-battles-ng-launcher-windows-${{ github.run_number }}
          path: ${{ runner.temp }}\ng-launcher-source\launcher\dist\wot-0.9.22-offline-battles-ng-Windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      # Symbols for this run's bwclient_h.exe; the player download omits them.
      - uses: actions/upload-artifact@v4
        with:
          name: wot-offline-battles-ng-symbols-${{ github.run_number }}
          path: ${{ runner.temp }}\ng-client\*.pdb
          if-no-files-found: error
          retention-days: 90
